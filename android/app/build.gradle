plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.google.gms.google-services") // keep if you use Firebase
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def hermesEnabled = true // change to false if you want JSC instead

android {
    namespace "dk.peterrosendahl.mycycle"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "dk.peterrosendahl.mycycle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10100
        versionName "1.1.0"
        resConfigs "en"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android:0.75.5") // use your RN version

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android:0.75.5") // same as RN version
    } else {
        implementation jscFlavor
    }
}

// Optional: Copy fonts from react-native-vector-icons
task copyFonts(type: Copy) {
    from "../../node_modules/react-native-vector-icons/Fonts"
    into "src/main/assets/fonts"
}

preBuild.dependsOn(copyFonts)

apply plugin: 'com.google.gms.google-services'
